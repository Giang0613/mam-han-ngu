name: Verify community source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:study
      - run: npm run test:hsk
      - run: npm run test:i18n
      - run: npm run test:english-ui
      - run: npm run test:dictionary-format
      - run: npm run test:vocabulary
      - run: npm run test:resources
      - run: npm run test:source
      - run: npm run build
